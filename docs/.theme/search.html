{% extends "main.html" %}
{% block title %}Search - {{ config.site_name|e }}{% endblock %}
{% block content %}
<h1>Search results</h1>
<p id="search-status" role="status">Enter a word, setting, or command in the search field.</p>
<noscript><p>Search needs JavaScript. You can still browse the documentation using the section links.</p></noscript>
<div id="search-results" data-base-url="{{ base_url|e }}"></div>
{% endblock %}
{% block scripts %}
<script src="{{ 'search/main.js'|url }}" defer></script>
{% endblock %}
